name: Deploy

on:
  push:
    branches: [gitops]
    paths:
      - 'src/**'
      - '!src/**/chart/values.yaml'   # ignore the bot's own Helm commits
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

# Queue runs so parallel pipelines don't fight over pushes to gitops
concurrency:
  group: deploy-gitops
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.changes.outputs.changed-services }}
      matrix: ${{ steps.changes.outputs.matrix }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          SERVICES=("ui" "catalog" "cart" "checkout" "orders")
          CHANGED_SERVICES=()

          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "🔄 Manual trigger - building all services"
            CHANGED_SERVICES=("${SERVICES[@]}")
          else
            BASE="$BEFORE_SHA"
            if [ -z "$BASE" ] || [ "$BASE" == "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="HEAD~1"
            fi

            # Capture the diff first (avoids SIGPIPE + pipefail problems with grep -q)
            DIFF="$(git diff --name-only "$BASE" HEAD | grep -v '^src/[^/]*/chart/values.yaml$' || true)"

            echo "🔍 Checking for changes in services..."
            for service in "${SERVICES[@]}"; do
              if grep -q "^src/${service}/" <<< "$DIFF"; then
                CHANGED_SERVICES+=("$service")
                echo "✅ Changes detected in: $service"
              else
                echo "⏭️ No changes in: $service"
              fi
            done
          fi

          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            echo "❌ No services changed"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX="$(printf '%s\n' "${CHANGED_SERVICES[@]}" | jq -R . | jq -sc '{service: .}')"

          echo "changed-services=${CHANGED_SERVICES[*]}" >> "$GITHUB_OUTPUT"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "has-changes=true" >> "$GITHUB_OUTPUT"

          echo "📊 Services to build: ${CHANGED_SERVICES[*]}"
          echo "📊 Generated matrix: ${MATRIX}"

  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::7}"
          ECR_REPO="${REGISTRY}/retail-store-${SERVICE}"

          echo "🔨 Building ${SERVICE}:${TAG}"

          # Create ECR repo if it doesn't exist
          aws ecr describe-repositories --region "${AWS_REGION}" \
            --repository-names "retail-store-${SERVICE}" >/dev/null 2>&1 || \
          aws ecr create-repository --region "${AWS_REGION}" \
            --repository-name "retail-store-${SERVICE}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

          docker build -t "${ECR_REPO}:${TAG}" -t "${ECR_REPO}:latest" "src/${SERVICE}/"
          docker push "${ECR_REPO}:${TAG}"
          docker push "${ECR_REPO}:latest"

          echo "✅ Pushed ${ECR_REPO}:${TAG}"
          echo "ECR_REPO=${ECR_REPO}" >> "$GITHUB_ENV"

      - name: Update Helm values for ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          TAG="${GITHUB_SHA::7}"
          VALUES_FILE="src/${SERVICE}/chart/values.yaml"

          echo "📝 Updating Helm values for ${SERVICE}"
          echo "   Repository: ${ECR_REPO}"
          echo "   Tag: ${TAG}"
          echo "   File: ${VALUES_FILE}"

          if [[ ! -f "${VALUES_FILE}" ]]; then
            echo "❌ Values file not found: ${VALUES_FILE}"
            exit 1
          fi

          echo "📋 Before update (main service image):"
          grep -A3 "^image:" "${VALUES_FILE}" | head -4 || echo "No main image section found"

          cp "${VALUES_FILE}" "${VALUES_FILE}.backup"

          # Update only the main service image (first repository/tag under top-level 'image:')
          awk -v repo="${ECR_REPO}" -v tag="${TAG}" '
          BEGIN { in_main_image = 0; updated_repo = 0; updated_tag = 0 }
          /^image:/ { in_main_image = 1; print; next }
          in_main_image && /^[[:space:]]*repository:/ && !updated_repo {
            print "  repository: " repo; updated_repo = 1; next
          }
          in_main_image && /^[[:space:]]*tag:/ && !updated_tag {
            print "  tag: \"" tag "\""; updated_tag = 1; next
          }
          /^[a-zA-Z]/ && !/^image:/ { in_main_image = 0 }
          { print }
          ' "${VALUES_FILE}.backup" > "${VALUES_FILE}"

          if grep -qF "${ECR_REPO}" "${VALUES_FILE}" && grep -qF "\"${TAG}\"" "${VALUES_FILE}"; then
            echo "✅ Successfully updated ${VALUES_FILE}"
            grep -A3 "^image:" "${VALUES_FILE}" | head -4
          else
            echo "❌ Update failed - restoring backup"
            mv "${VALUES_FILE}.backup" "${VALUES_FILE}"
            exit 1
          fi

          rm "${VALUES_FILE}.backup"

      - name: Commit Helm changes for ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          TAG="${GITHUB_SHA::7}"

          git config --local user.email "gitops@github.com"
          git config --local user.name "GitOps Bot"

          if git diff --quiet "src/${SERVICE}/chart/values.yaml"; then
            echo "📝 No Helm changes to commit for ${SERVICE}"
            exit 0
          fi

          git add "src/${SERVICE}/chart/values.yaml"
          git commit -m "🚀 Update ${SERVICE} Helm chart to ${TAG} - ECR: retail-store-${SERVICE} - Commit: ${GITHUB_SHA}"

          pushed=false
          for i in 1 2 3 4 5; do
            if git push origin HEAD:gitops; then
              echo "✅ Successfully pushed Helm update for ${SERVICE}"
              pushed=true
              break
            fi
            echo "⚠️ Push failed for ${SERVICE}, attempt $i/5. Rebasing and retrying..."
            git pull --rebase origin gitops
            sleep $((RANDOM % 5 + 2))
          done

          if [ "$pushed" != "true" ]; then
            echo "❌ Failed to push ${SERVICE} after 5 attempts"
            exit 1
          fi

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy]
    if: always()
    steps:
      - name: Create deployment summary
        env:
          HAS_CHANGES: ${{ needs.detect-changes.outputs.has-changes }}
          CHANGED: ${{ needs.detect-changes.outputs.changed-services }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          {
            echo "## 🚀 Deployment Summary"
            echo ""
            echo "**Commit:** ${{ github.sha }}"
            echo "**Branch:** gitops"
            echo "**Triggered by:** ${{ github.actor }}"
            echo ""

            if [ "$HAS_CHANGES" == "true" ]; then
              echo "**Changed Services:** ${CHANGED}"
              echo ""
              if [ "$DEPLOY_RESULT" == "success" ]; then
                echo "✅ **Status:** Deployment successful"
                echo ""
                echo "**Actions completed:**"
                echo "- 🔨 Built and pushed Docker images to ECR"
                echo "- 📝 Updated Helm chart values"
                echo "- 💾 Committed changes to repository"
                echo "- 🔄 ArgoCD will sync automatically"
              else
                echo "❌ **Status:** Deployment ${DEPLOY_RESULT}"
                echo "Check the workflow logs for details"
              fi
            else
              echo "ℹ️ **Status:** No services changed - no deployment needed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"